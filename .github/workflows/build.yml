name: Build Mac app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        run: |
          npm test
          npm run build
          cd src-tauri && cargo test

      # Every push: build the app and attach it to the run (Actions tab > run > Artifacts).
      - name: Build (universal: Apple silicon and Intel)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Writing-Studio-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # Version tags (v0.1.0, v0.2.0 ...): publish a release with the installer.
      - uses: tauri-apps/tauri-action@v0
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Writing Studio ${{ github.ref_name }}
          releaseBody: Download the .dmg below, open it and drag Writing Studio to Applications.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
