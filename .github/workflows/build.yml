name: Build Mac app

on:
  push:
    branches: [main]
    paths-ignore: ['capture/**']   # the iPhone page deploys on Netlify, not as a Mac release
  pull_request:
    paths-ignore: ['capture/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Test
        run: |
          npm test
          npm run build
          cd src-tauri && cargo test

      # Pull requests: build the app and attach it to the run (Actions tab > run > Artifacts).
      - name: Build for Apple silicon and Intel Macs
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --target universal-apple-darwin

      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: Writing-Studio-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      # main: publish a release named after the version in src-tauri/tauri.conf.json.
      # Bump that version for each new release; a push without a bump refreshes the installer.
      - uses: tauri-apps/tauri-action@v0
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update so installed copies of the app trust it (see README > Updates).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: Writing Studio v__VERSION__
          releaseBody: Download the .dmg below, open it and drag Writing Studio to Applications.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
