[package]
name = "writing-studio"
version = "0.2.0"
description = "A calm Markdown writing app for books"
edition = "2021"

[lib]
name = "writing_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
chrono = "0.4"
hostname = "0.4"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
